name: Build

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: '45 4 * * 0,3'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      - name: Install Spigot Dependencies
        run: |
          chmod +x scripts/installSpigotDependencies.sh
          ./scripts/installSpigotDependencies.sh

      - name: Build Shopkeepers
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Stage artifacts for upload
        run: |
          mkdir -p staging
          cp build/*.jar staging/ 2>/dev/null || cp modules/plugin/build/libs/*.jar staging/ || echo "No jars found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShopkeepersFolia-Build
          path: staging/*.jar
